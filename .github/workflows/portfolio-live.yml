name: Publish portfolio
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-live
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: '${{ secrets.FIREBASE_PORTFOLIO_HOSTING }}'
      - name: Deploy public Hosting only
        run: npx --yes firebase-tools@15.30.0 deploy --only hosting --project michael-pytlowany --non-interactive
