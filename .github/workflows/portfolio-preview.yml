name: Portfolio preview
on:
  pull_request:
    paths:
      - 'portfolio-public/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/portfolio-*.yml'
permissions:
  contents: read
concurrency:
  group: portfolio-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: '${{ secrets.FIREBASE_PORTFOLIO_HOSTING }}'
      - name: Publish Hosting preview only
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npx --yes firebase-tools@15.30.0 hosting:channel:deploy "pr-${PR_NUMBER}" --expires 7d --project michael-pytlowany --non-interactive --no-authorized-domains
